name: ai-dependencies-review
on:
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  review:
    if: |
      contains(github.event.pull_request.labels.*.name, 'major') &&
      contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            This PR was opened by Renovate to bump a Docker image tag
            (a major version update). Look at the diff to find the
            image name, old tag, and new tag.

            Research the maintainer's official docs for this exact
            update:
            - GitHub releases / CHANGELOG for the image's source repo
            - The image's official Dockerfile / docker-compose example,
              if published, for any new required env vars, volumes,
              or config keys
            - Any documented breaking changes or migration steps
              between the old and new version

            Post a single PR comment with:
            - Verdict: "Safe to merge" / "Needs review" / "Do not merge"
              (base "Do not merge" only on it being a pre-release/beta/rc,
              since Renovate config already filters most of those)
            - 2-4 bullet summary of what changed
            - Any required nix config changes based on the maintainer's
              docs (env vars, migration steps), if applicable
            - Links to the sources you used

            Do not modify any files. Only post a comment.
