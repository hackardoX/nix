name: Checks
on:
  - pull_request
  - merge_group
jobs:
  homelab:
    name: Homelab checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.ASAHI_FIRMWARE_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |-
            extra-experimental-features = pipe-operators
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: hackardo
          authToken: "${{ secrets.CACHIX_GITHUB_ACTION_TOKEN }}"
      - name: Build homelab checks
        run: |
          set -euo pipefail
          names=$(nix eval --json ".#checks.x86_64-linux" --apply 'c: builtins.filter (n: builtins.substring 0 8 n == "homelab/") (builtins.attrNames c)' | jq -r '.[]')
          if [ -z "$names" ]; then
            echo "No homelab/* checks found for x86_64-linux" >&2
            exit 1
          fi
          while IFS= read -r name; do
            nix build ".#checks.x86_64-linux.\"$name\"" --print-build-logs --no-link
          done <<< "$names"
