name: Build
on:
  - pull_request
  - workflow_dispatch
jobs:
  builds:
    name: Build ${{ matrix.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Andrea-MacBook-Air-CI
            os: macos-latest
            check: configurations/darwin/Andrea-MacBook-Air-CI
            system: aarch64-darwin
          - name: Proton-MacBook-Pro-CI
            os: macos-latest
            check: configurations/darwin/Proton-MacBook-Pro-CI
            system: aarch64-darwin
          - name: HomeLab-CI
            os: ubuntu-26.04-arm
            check: configurations/nixos/HomeLab-CI
            system: aarch64-linux
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.ASAHI_FIRMWARE_DEPLOY_KEY }}
      # - uses: wimpysworld/nothing-but-nix@main
      #   with:
      #     hatchet-protocol: "holster"
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |-
            extra-experimental-features = pipe-operators
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: hackardo
          authToken: "${{ secrets.CACHIX_GITHUB_ACTION_TOKEN }}"
      - name: Build ${{ matrix.name }}
        run: nix build .#checks.${{ matrix.system }}."${{ matrix.check }}" --print-build-logs
